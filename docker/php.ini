; Legacy code: hide notices/warnings/deprecations that predate PHP 7.
; OJO: config/config.php vuelve a subir el nivel en runtime (deja E_WARNING
; activo) para cada pagina del juego, asi que este valor solo rige antes de
; incluir ese archivo. Es intencional: los warnings se quieren ver.
error_reporting = E_ALL & ~E_NOTICE & ~E_WARNING & ~E_DEPRECATED
display_errors = On

; Ademas de mostrarlos, registrarlos: sin esto un warning solo existia mientras
; alguien miraba la pagina y no quedaba rastro para revisarlo despues.
; Sin error_log, el SAPI de Apache los manda a su propio log, que en esta imagen
; sale por stderr y por lo tanto aparece en `docker compose logs web`.
log_errors = On
short_open_tag = On
memory_limit = 256M
max_execution_time = 120
date.timezone = America/Argentina/Buenos_Aires
session.cookie_lifetime = 2592000
session.gc_maxlifetime = 2592000

; Sin opcache cada request recompilaba el codigo desde cero: 450 KB de fuente solo
; para la cadena de includes de Database.php, y ~1,5 MB para una pagina de juego
; completa (GameEngine + Data + Lang), sobre 987 archivos .php y .tpl. En la Pi eso
; era la mayor parte del tiempo de TODAS las paginas, no de una en particular.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
; 987 archivos hoy, con lugar para crecer. PHP redondea al primo siguiente.
opcache.max_accelerated_files = 4000

; OJO: validate_timestamps TIENE que quedar en 1. El deploy de produccion es un
; `git pull` sobre el bind mount y el contenedor NO se reinicia (ver deploy.sh), asi
; que con la validacion apagada el codigo nuevo no se cargaria nunca y el sitio
; seguiria sirviendo la version vieja hasta que alguien reiniciara Apache a mano.
; Con revalidate_freq = 2 un deploy tarda a lo sumo 2 segundos en verse.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
